name: TEST independent availability
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      exercise:
        description: 'Controlled one-incident failure/recovery drill'
        type: boolean
        default: false
  push:
    branches: ['feature/project-bootstrap']
    paths: ['.github/workflows/test-availability.yml', 'scripts/operations/external-monitor.py']
permissions:
  contents: read
  issues: write
concurrency:
  group: appleklinika-test-availability
  cancel-in-progress: false
jobs:
  availability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/operations
      - name: Offline notification state checks
        run: python3 scripts/operations/external-monitor.py --self-test
      - name: Public TEST endpoints and one incident
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXERCISE: ${{ inputs.exercise || github.event_name == 'push' }}
        run: |
          if [ "$EXERCISE" = true ]; then
            python3 scripts/operations/external-monitor.py --exercise
          else
            python3 scripts/operations/external-monitor.py
          fi
