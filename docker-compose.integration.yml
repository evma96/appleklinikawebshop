# LOCAL reconciliation only. Keep the two existing databases separate.
services:
  wordpress:
    environment:
      AK_LOCAL_VERIFICATION: "1"
    volumes:
      - ${LOCAL_UPLOADS_PATH:?Set the private LOCAL upload copy}:/var/www/html/wp-content/uploads
      - ./docker/php/local-verification.ini:/usr/local/etc/php/conf.d/local-verification.ini:ro
      - ./docker/php/local-verification-guard.php:/usr/local/etc/php/local-verification-guard.php:ro
    networks:
      - default
networks:
  default:
    external: true
    name: ${LOCAL_RUNTIME_NETWORK:?Set the existing LOCAL database network}
