# TEST: root-owned, mounted read-only into Apache. Media stays readable;
# no upload .htaccess may re-enable execution or open protected documents.
<Directory "/var/www/html/wp-content/uploads">
    AllowOverride None
    Options -Indexes -ExecCGI
    <FilesMatch "(?i)\.(php[0-9]*|phtml|phar)(\.|$)">
        Require all denied
    </FilesMatch>
</Directory>
<DirectoryMatch "^/var/www/html/wp-content/uploads/(wc_szamlazz|gls-shipping-labels|wc-logs|woocommerce_uploads)(/|$)">
    Require all denied
</DirectoryMatch>
